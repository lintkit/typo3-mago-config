version = "1"

# Overridden by the MAGO_PHP_VERSION environment variable
php-version = "8.4"

[source]
paths = ["."]
includes = ["vendor"]
excludes = [
	".*/**",
	"**/.Build/**",
	"**/Library/**",
	"**/node_modules/**",
	"var/**",

	# Projects
	"backup/**",
	"html/**",

	# TYPO3
	"config/system/settings.php",
	"typo3/**",
	"vendor/typo3/class-alias-loader/res/**",
]

###
# Formatter
###

[formatter]
preset = "psr-12"

# Indentation & line length
use-tabs = true
tab-width = 4
print-width = 120

# Spacing
space-after-cast-unary-prefix-operators = false
space-before-arrow-function-parameter-list-parenthesis = true
space-around-concatenation-binary-operator = true

# Use statements
sort-uses = "alpha-ascending"
separate-use-types = true
expand-use-groups = true

# Layout
trailing-comma = true
method-chain-semicolon-on-next-line = true
null-type-hint = "question"
empty-line-after-opening-tag = true
parameter-attribute-on-new-line = false

# Keep line breaks added by hand
preserve-breaking-parameter-list = true
preserve-breaking-argument-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-member-access-chain = true
preserve-breaking-array-like = true

###
# Linter
###

[linter]
integrations = ["phpunit", "symfony"]
baseline = ".mago/baseline-lint.toml"

# Test classes grow with coverage, and Extbase models have a getter and setter for every database column
[linter.rules.too-many-methods]
level = "warning"
exclude = [
	"**/Tests/**",
	"**/Classes/Domain/Model/**",
]

# Extbase models map every database column to a property
[linter.rules.too-many-properties]
exclude = ["**/Classes/Domain/Model/**"]

# Complexity scores are hints, so report them without failing the build
[linter.rules.cyclomatic-complexity]
level = "warning"

[linter.rules.kan-defect]
level = "warning"

# Assignments in conditions are easily mistaken for comparisons, e.g. if ($a = 1)
[linter.rules.no-assign-in-condition]
level = "error"

# TYPO3 exception codes are timestamps; keep them searchable as plain integers
[linter.rules.readable-literal]
enabled = false

# TYPO3 registers TCA and configuration through $GLOBALS
[linter.rules.no-global]
exclude = [
	"**/Configuration/TCA/**",
	"**/ext_localconf.php",
	"**/ext_tables.php",
	"config/system/*.php",
]

# ext_emconf.php is read by the TYPO3 extension manager and must not declare strict types
[linter.rules.strict-types]
exclude = ["**/ext_emconf.php"]

###
# Analyzer
###

[analyzer]
baseline = ".mago/baseline-analyze.toml"
find-unused-parameters = true
check-missing-override = true

# TYPO3 entry-point files start with the `defined('TYPO3') || die();` access guard
ignore = [
	{ code = "unused-statement", pattern = "binary operation", in = [
		"**/Configuration/TCA/**",
		"**/ext_localconf.php",
		"**/ext_tables.php",
	] },
]
